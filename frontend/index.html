<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>iSEL AI Assistant — Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
    }

    header {
      background: #1a56db;
      color: white;
      padding: 16px 32px;
      font-size: 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header span { font-size: 24px; }

    .container {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 24px;
      padding: 24px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h2 {
      font-size: 16px;
      font-weight: 600;
      color: #1a56db;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Upload section */
    .upload-area {
      border: 2px dashed #c3d4f7;
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
      margin-bottom: 12px;
    }

    .upload-area:hover { border-color: #1a56db; }
    .upload-area p { color: #6b7280; font-size: 14px; margin-top: 8px; }

    .btn {
      width: 100%;
      padding: 10px;
      background: #1a56db;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover { background: #1648c0; }
    .btn:disabled { background: #9ca3af; cursor: not-allowed; }

    .doc-list { margin-top: 20px; }

    .doc-list h3 {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .doc-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: #f9fafb;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .doc-item .doc-name {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #374151;
      word-break: break-all;
    }

    .doc-item .doc-size { color: #9ca3af; font-size: 12px; }

    .badge {
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
    }

    .badge-green { background: #d1fae5; color: #065f46; }
    .badge-blue { background: #dbeafe; color: #1e40af; }

    .status-msg {
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }

    .status-msg.success { background: #d1fae5; color: #065f46; display: block; }
    .status-msg.error { background: #fee2e2; color: #991b1b; display: block; }
    .status-msg.info { background: #dbeafe; color: #1e40af; display: block; }

    /* Chat section */
    .chat-wrapper {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 130px);
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      display: flex;
      gap: 10px;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user { flex-direction: row-reverse; }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .avatar.bot { background: #dbeafe; }
    .avatar.user { background: #d1fae5; }

    .bubble {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .message.bot .bubble {
      background: #f3f4f6;
      color: #111827;
      border-top-left-radius: 2px;
    }

    .message.user .bubble {
      background: #1a56db;
      color: white;
      border-top-right-radius: 2px;
    }

    .message.bot.handoff .bubble {
      background: #fef3c7;
      color: #92400e;
      border-left: 3px solid #f59e0b;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }

    .chip {
      padding: 6px 14px;
      background: white;
      border: 1.5px solid #1a56db;
      color: #1a56db;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .chip:hover { background: #1a56db; color: white; }

    .source-tag {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 4px;
      padding-left: 4px;
    }

    .typing {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 14px 16px;
      background: #f3f4f6;
      border-radius: 12px;
      border-top-left-radius: 2px;
      width: fit-content;
    }

    .typing span {
      width: 8px;
      height: 8px;
      background: #9ca3af;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    .chat-input-area {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
    }

    .chat-input-area input {
      flex: 1;
      padding: 12px 16px;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .chat-input-area input:focus { border-color: #1a56db; }

    .send-btn {
      width: 46px;
      height: 46px;
      background: #1a56db;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .send-btn:hover { background: #1648c0; }
    .send-btn:disabled { background: #9ca3af; cursor: not-allowed; }

    #file-input { display: none; }
  </style>
</head>
<body>

<header>
  <span>🤖</span>
  iSEL AI Assistant — Demo Panel
</header>

<div class="container">

  <!-- LEFT: Document Management -->
  <div class="card">
    <h2>📁 База знаний</h2>

    <div class="upload-area" onclick="document.getElementById('file-input').click()">
      <div style="font-size: 32px;">📄</div>
      <p>Нажмите чтобы выбрать файл</p>
      <p style="font-size: 12px; margin-top: 4px;">PDF, TXT, MD, DOCX</p>
    </div>

    <input type="file" id="file-input" accept=".pdf,.txt,.md,.docx"
           onchange="handleFileSelect(this)" />

    <div id="selected-file" style="font-size: 13px; color: #374151; margin-bottom: 10px; display: none;">
      📎 <span id="selected-name"></span>
    </div>

    <button class="btn" id="upload-btn" onclick="uploadFile()" disabled>
      Загрузить документ
    </button>

    <div id="upload-status" class="status-msg"></div>

    <div class="doc-list">
      <h3>Загруженные документы</h3>
      <div id="doc-list-container">
        <p style="font-size: 13px; color: #9ca3af;">Загрузка списка...</p>
      </div>
    </div>
  </div>

  <!-- RIGHT: Chat -->
  <div class="card">
    <h2>🤖 Чат с ассистентом</h2>

    <div class="chat-wrapper">
      <div class="chat-messages" id="chat-messages">
        <!-- Welcome message -->
        <div class="message bot">
          <div class="avatar bot">🤖</div>
          <div>
            <div class="bubble">Привет! Я ИИ-ассистент платформы iSEL. Чем могу помочь?</div>
            <div class="chips">
              <div class="chip" onclick="sendMessage('Как добавить объект недвижимости?')">
                Добавить объект
              </div>
              <div class="chip" onclick="sendMessage('Как заполнить заявление на ТУ?')">
                Заявление на ТУ
              </div>
              <div class="chip" onclick="sendMessage('Нужен оператор')">
                Позвать оператора
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="chat-input-area">
        <input
          type="text"
          id="chat-input"
          placeholder="Введите вопрос..."
          onkeydown="if(event.key==='Enter') sendMessage()"
        />
        <button class="send-btn" id="send-btn" onclick="sendMessage()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>
  </div>

</div>

<script>
  const API = 'http://localhost:8001/api/v1';
  let sessionId = 'demo-' + Math.random().toString(36).substr(2, 9);
  let selectedFile = null;

  // ─── Documents ────────────────────────────────────────────────────────────

  function handleFileSelect(input) {
    selectedFile = input.files[0];
    if (!selectedFile) return;
    document.getElementById('selected-name').textContent = selectedFile.name;
    document.getElementById('selected-file').style.display = 'block';
    document.getElementById('upload-btn').disabled = false;
  }

  async function uploadFile() {
    if (!selectedFile) return;

    const btn = document.getElementById('upload-btn');
    const status = document.getElementById('upload-status');

    btn.disabled = true;
    btn.textContent = 'Загружаю...';
    status.className = 'status-msg info';
    status.textContent = '⏳ Загрузка и обработка документа...';

    const formData = new FormData();
    formData.append('file', selectedFile);

    try {
      const res = await fetch(`${API}/upload`, {
        method: 'POST',
        body: formData
      });
      const data = await res.json();

      if (res.ok) {
        status.className = 'status-msg success';
        status.textContent = '✅ Документ загружен и обрабатывается в фоне';
        selectedFile = null;
        document.getElementById('selected-file').style.display = 'none';
        document.getElementById('file-input').value = '';
        setTimeout(loadDocuments, 25000);
      } else {
        status.className = 'status-msg error';
        status.textContent = '❌ Ошибка: ' + (data.detail || 'Неизвестная ошибка');
      }
    } catch (e) {
      status.className = 'status-msg error';
      status.textContent = '❌ Сервер недоступен';
    }

    btn.textContent = 'Загрузить документ';
    btn.disabled = false;
  }

  async function loadDocuments() {
    try {
      const res = await fetch(`${API}/documents`);
      const data = await res.json();
      const container = document.getElementById('doc-list-container');

      if (data.documents.length === 0) {
        container.innerHTML = '<p style="font-size:13px;color:#9ca3af;">Нет загруженных документов</p>';
        return;
      }

      container.innerHTML = data.documents.map(doc => `
        <div class="doc-item" id="doc-${CSS.escape(doc.filename)}">
          <div class="doc-name">
            📄 <span>${doc.filename.substring(0, 30)}${doc.filename.length > 30 ? '...' : ''}</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="doc-size">${doc.size_kb} KB</span>
            <span class="badge badge-green">✓ готов</span>
            <button
              onclick="deleteDocument('${doc.filename}')"
              style="background:none;border:none;cursor:pointer;padding:4px;color:#ef4444;font-size:16px;line-height:1;"
              title="Удалить документ"
            >🗑️</button>
          </div>
        </div>
      `).join('');
    } catch (e) {
      document.getElementById('doc-list-container').innerHTML =
        '<p style="font-size:13px;color:#ef4444;">Ошибка загрузки списка</p>';
    }
  }

  async function deleteDocument(filename) {
    if (!confirm(`Удалить документ?\n${filename}`)) return;

    try {
      const res = await fetch(`${API}/documents/${encodeURIComponent(filename)}`, {
        method: 'DELETE'
      });

      if (res.ok) {
        const item = document.getElementById(`doc-${CSS.escape(filename)}`);
        if (item) {
          item.style.transition = 'opacity 0.3s';
          item.style.opacity = '0';
          setTimeout(() => { item.remove(); }, 300);
        }
      } else {
        const data = await res.json();
        alert('Ошибка удаления: ' + (data.detail || 'Неизвестная ошибка'));
      }
    } catch (e) {
      alert('Сервер недоступен');
    }
  }

  // ─── Chat ─────────────────────────────────────────────────────────────────

  function renderMarkdown(text) {
    return text
      // Bold: **text**
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      // Headers: ### text
      .replace(/^### (.+)$/gm, '<div style="font-weight:600;margin:8px 0 4px;font-size:15px;">$1</div>')
      .replace(/^## (.+)$/gm, '<div style="font-weight:700;margin:10px 0 4px;font-size:16px;">$1</div>')
      // Numbered list: 1. text
      .replace(/^\d+\.\s(.+)$/gm, '<div style="margin:4px 0;padding-left:4px;">$&</div>')
      // Bullet: • text or - text
      .replace(/^[•\-]\s(.+)$/gm, '<div style="margin:3px 0;padding-left:8px;">• $1</div>')
      // Line breaks
      .replace(/\n/g, '<br>');
  }

  function addMessage(text, role, source = '', handoff = false) {
    const container = document.getElementById('chat-messages');

    const div = document.createElement('div');
    div.className = `message ${role}${handoff ? ' handoff' : ''}`;

    const avatar = role === 'bot' ? '🤖' : '👤';
    const sourceTag = source === 'rule_based' ? `<div class="source-tag">⚡ быстрый ответ</div>` : '';

    div.innerHTML = `
      <div class="avatar ${role}">${avatar}</div>
      <div>
        <div class="bubble">${renderMarkdown(text)}</div>
        ${sourceTag}
      </div>
    `;

    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  }

  function addTyping() {
    const container = document.getElementById('chat-messages');
    const div = document.createElement('div');
    div.className = 'message bot';
    div.id = 'typing-indicator';
    div.innerHTML = `
      <div class="avatar bot">🤖</div>
      <div class="typing">
        <span></span><span></span><span></span>
      </div>
    `;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  async function sendMessage(text) {
    const input = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const message = text || input.value.trim();
    const page = '/demo';

    if (!message) return;

    input.value = '';
    sendBtn.disabled = true;

    addMessage(message, 'user');
    addTyping();

    try {
      const res = await fetch(`${API}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message,
          session_id: sessionId,
          page,
          language: 'ru'
        })
      });

      const data = await res.json();
      removeTyping();
      addMessage(data.answer, 'bot', data.source, data.handoff);

    } catch (e) {
      removeTyping();
      addMessage('❌ Сервер недоступен. Проверьте подключение.', 'bot');
    }

    sendBtn.disabled = false;
    input.focus();
  }

  // ─── Init ─────────────────────────────────────────────────────────────────
  loadDocuments();
  setInterval(loadDocuments, 10000);
</script>

</body>
</html>
