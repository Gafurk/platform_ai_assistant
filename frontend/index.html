<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>iSEL AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.1.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: #f0f4ff;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Page shell ─────────────────────────────────────────────────── */

    .page-header {
      padding: 18px 36px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: white;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }

    .header-logo {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, #1a56db, #3b82f6);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
    }

    .header-text h1 {
      font-size: 16px;
      font-weight: 600;
      color: #0f172a;
      letter-spacing: -0.3px;
    }

    .header-text p {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 400;
      margin-top: 1px;
    }

    .page-body {
      padding: 36px;
      max-width: 520px;
    }

    /* ── Document card ───────────────────────────────────────────────── */

    .doc-card {
      background: white;
      border-radius: 20px;
      padding: 26px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.05);
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: #0f172a;
      letter-spacing: -0.2px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .card-title-icon {
      width: 30px;
      height: 30px;
      background: #eff6ff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }

    .upload-area {
      border: 1.5px dashed #cbd5e1;
      border-radius: 14px;
      padding: 26px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 12px;
      background: #fafbff;
    }

    .upload-area:hover {
      border-color: #1a56db;
      background: #f0f4ff;
    }

    .upload-icon-wrap {
      width: 44px;
      height: 44px;
      background: #eff6ff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 10px;
      font-size: 20px;
    }

    .upload-area p {
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
    }

    .upload-area p strong { color: #1a56db; font-weight: 500; }

    .selected-file-row {
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #374151;
      padding: 8px 12px;
      background: #f8fafc;
      border-radius: 9px;
      margin-bottom: 10px;
    }

    .upload-btn {
      width: 100%;
      padding: 11px 16px;
      background: #1a56db;
      color: white;
      border: none;
      border-radius: 11px;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: -0.1px;
      transition: all 0.2s ease;
    }

    .upload-btn:hover:not(:disabled) {
      background: #1648c0;
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(26,86,219,0.3);
    }

    .upload-btn:disabled { background: #e2e8f0; color: #94a3b8; cursor: not-allowed; }

    .reindex-btn {
      width: 100%;
      padding: 10px 16px;
      background: transparent;
      color: #1a56db;
      border: 1.5px solid #c7d8f8;
      border-radius: 11px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: -0.1px;
      transition: all 0.2s ease;
      margin-top: 8px;
    }

    .reindex-btn:hover:not(:disabled) {
      background: #eff6ff;
      border-color: #1a56db;
    }

    .reindex-btn:disabled { border-color: #e2e8f0; color: #94a3b8; cursor: not-allowed; }

    .status-msg {
      margin-top: 10px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.45;
      display: none;
    }

    .status-msg.success { background: #ecfdf5; color: #065f46; display: block; }
    .status-msg.error   { background: #fef2f2; color: #991b1b; display: block; }
    .status-msg.info    { background: #eff6ff; color: #1e40af; display: block; }

    .doc-list-section { margin-top: 22px; }

    .doc-list-label {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      font-weight: 500;
      margin-bottom: 10px;
    }

    .doc-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      background: #f8fafc;
      border-radius: 10px;
      margin-bottom: 6px;
      font-size: 13px;
      transition: background 0.15s;
    }

    .doc-item:hover { background: #f1f5f9; }

    .doc-name {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #334155;
      font-weight: 400;
      min-width: 0;
    }

    .doc-name span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .doc-meta { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }

    .doc-size { color: #94a3b8; font-size: 12px; }

    .doc-badge {
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      background: #ecfdf5;
      color: #059669;
    }

    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 3px 5px;
      color: #cbd5e1;
      font-size: 13px;
      line-height: 1;
      transition: color 0.15s;
      border-radius: 5px;
    }

    .delete-btn:hover { color: #ef4444; }

    /* ── FAB ────────────────────────────────────────────────────────── */

    .fab-wrap {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 1000;
    }

    .fab-pulse {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: rgba(26,86,219,0.22);
      animation: fabPulse 2.8s ease-out infinite;
      pointer-events: none;
    }

    @keyframes fabPulse {
      0%   { transform: scale(1);   opacity: 0.8; }
      100% { transform: scale(1.9); opacity: 0; }
    }

    .fab {
      position: relative;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #1a56db;
      box-shadow: 0 6px 20px rgba(26,86,219,0.42);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      transition: transform 0.28s cubic-bezier(0.34,1.56,0.64,1),
                  box-shadow 0.28s ease;
    }

    .fab:hover {
      transform: scale(1.1);
      box-shadow: 0 10px 28px rgba(26,86,219,0.5);
    }

    .fab .icon-chat  { display: flex; }
    .fab .icon-close { display: none; }
    .fab.open .icon-chat  { display: none; }
    .fab.open .icon-close { display: flex; }

    /* ── Chat widget ────────────────────────────────────────────────── */

    .chat-widget {
      position: fixed;
      bottom: 102px;
      right: 28px;
      width: 400px;
      height: 600px;
      z-index: 999;
      border-radius: 26px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: rgba(255,255,255,0.76);
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.55) inset,
        0 2px 4px rgba(0,0,0,0.04),
        0 16px 48px rgba(0,0,0,0.13),
        0 40px 80px rgba(0,0,0,0.08);
      /* closed state */
      opacity: 0;
      transform: scale(0.88) translateY(16px);
      transform-origin: bottom right;
      pointer-events: none;
      transition:
        opacity 0.32s cubic-bezier(0.16,1,0.3,1),
        transform 0.32s cubic-bezier(0.16,1,0.3,1);
    }

    .chat-widget.open {
      opacity: 1;
      transform: scale(1) translateY(0);
      pointer-events: all;
    }

    /* Widget header */
    .widget-header {
      padding: 16px 18px 13px;
      border-bottom: 1px solid rgba(0,0,0,0.055);
      display: flex;
      align-items: center;
      gap: 11px;
      flex-shrink: 0;
    }

    .w-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1a56db 0%, #60a5fa 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .w-info h3 {
      font-size: 14px;
      font-weight: 600;
      color: #0f172a;
      letter-spacing: -0.2px;
    }

    .w-status {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      color: #10b981;
      margin-top: 1px;
      font-weight: 500;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
    }

    /* Messages */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px 14px 6px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar { width: 3px; }
    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.09);
      border-radius: 4px;
    }

    .message {
      display: flex;
      gap: 8px;
      animation: msgIn 0.26s cubic-bezier(0.16,1,0.3,1);
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #eff6ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      align-self: flex-end;
    }

    .bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 13.5px;
      line-height: 1.58;
      white-space: pre-wrap;
    }

    .message.bot .bubble {
      background: #f1f5f9;
      color: #1e293b;
      border-bottom-left-radius: 5px;
    }

    .message.user .bubble {
      background: #1a56db;
      color: white;
      border-bottom-right-radius: 5px;
    }

    .message.bot.handoff .bubble {
      background: #fffbeb;
      color: #92400e;
      border-left: 2px solid #f59e0b;
      border-bottom-left-radius: 5px;
    }

    .source-tag {
      font-size: 10.5px;
      color: #94a3b8;
      margin-top: 3px;
      padding-left: 2px;
    }

    /* Chips */
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .chip {
      padding: 6px 13px;
      background: rgba(26,86,219,0.07);
      color: #1a56db;
      border-radius: 20px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      font-family: inherit;
      letter-spacing: -0.1px;
      transition: all 0.18s ease;
    }

    .chip:hover {
      background: #1a56db;
      color: white;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(26,86,219,0.28);
    }

    /* Typing indicator */
    .typing-bubble {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 11px 14px;
      background: #f1f5f9;
      border-radius: 18px;
      border-bottom-left-radius: 5px;
      width: fit-content;
    }

    .typing-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #94a3b8;
      animation: typingPulse 1.4s ease-in-out infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.18s; }
    .typing-dot:nth-child(3) { animation-delay: 0.36s; }

    @keyframes typingPulse {
      0%, 60%, 100% { transform: scale(1);   opacity: 0.45; }
      30%           { transform: scale(1.35); opacity: 1; }
    }

    /* Input zone */
    .input-zone {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px 15px;
      border-top: 1px solid rgba(0,0,0,0.055);
      background: rgba(255,255,255,0.55);
      backdrop-filter: blur(10px);
      flex-shrink: 0;
    }

    .chat-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      font-size: 13.5px;
      font-family: inherit;
      color: #0f172a;
      line-height: 1.4;
      padding: 4px 0;
    }

    .chat-input::placeholder { color: #94a3b8; }

    .send-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #1a56db;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .send-btn:hover:not(:disabled) {
      background: #1648c0;
      transform: scale(1.1);
      box-shadow: 0 4px 12px rgba(26,86,219,0.38);
    }

    .send-btn:disabled { background: #e2e8f0; cursor: not-allowed; }

    #file-input { display: none; }

    /* ── Uicons sizing ──────────────────────────────────────────────── */
    /* Dashboard */
    .header-logo i    { font-size: 17px; color: white; }
    .card-title-icon i { font-size: 15px; color: #1a56db; }
    .upload-icon-wrap i { font-size: 26px; color: #1a56db; }
    .doc-name i       { font-size: 14px; color: #94a3b8; flex-shrink: 0; }
    .delete-btn i     { font-size: 13px; }
    /* Widget */
    .w-avatar         { font-size: 0; }
    .w-avatar i       { font-size: 18px; color: white; }
    .msg-avatar       { font-size: 0; }
    .msg-avatar i     { font-size: 14px; color: #1a56db; }
    .fab .icon-chat i { font-size: 22px; color: white; }
    .fab .icon-close i { font-size: 18px; color: white; }
    .send-btn i       { font-size: 15px; color: white; }
  </style>
</head>
<body>

<!-- Page header -->
<header class="page-header">
  <div class="header-logo"><i class="fi fi-rr-comment-alt"></i></div>
  <div class="header-text">
    <h1>iSEL AI Assistant</h1>
    <p>Панель администратора — База знаний</p>
  </div>
</header>

<!-- Document management panel -->
<div class="page-body">
  <div class="doc-card">
    <div class="card-title">
      <div class="card-title-icon"><i class="fi fi-rr-folder"></i></div>
      База знаний
    </div>

    <div class="upload-area" onclick="document.getElementById('file-input').click()">
      <div class="upload-icon-wrap"><i class="fi fi-rr-cloud-upload"></i></div>
      <p><strong>Нажмите для выбора файла</strong></p>
      <p style="font-size:12px;margin-top:3px;">PDF, TXT, MD, DOCX</p>
    </div>

    <input type="file" id="file-input" accept=".pdf,.txt,.md,.docx" onchange="handleFileSelect(this)" />

    <div class="selected-file-row" id="selected-file">
      <i class="fi fi-rr-clip" style="font-size:13px;color:#94a3b8;"></i>
      <span id="selected-name"></span>
    </div>

    <button class="upload-btn" id="upload-btn" onclick="uploadFile()" disabled>
      Загрузить документ
    </button>

    <div id="upload-status" class="status-msg"></div>

    <button class="reindex-btn" id="reindex-btn" onclick="reindex()">
      ↺ Переиндексировать граф знаний
    </button>
    <div id="reindex-status" class="status-msg"></div>

    <div class="doc-list-section">
      <div class="doc-list-label">Загруженные документы</div>
      <div id="doc-list-container">
        <p style="font-size:13px;color:#94a3b8;">Загрузка...</p>
      </div>
    </div>
  </div>
</div>

<!-- FAB -->
<div class="fab-wrap">
  <div class="fab-pulse"></div>
  <button class="fab" id="fab" onclick="toggleChat()">
    <span class="icon-chat"><i class="fi fi-rr-comment-alt"></i></span>
    <span class="icon-close"><i class="fi fi-rr-cross"></i></span>
  </button>
</div>

<!-- Chat widget -->
<div class="chat-widget" id="chat-widget">

  <div class="widget-header">
    <div class="w-avatar"><i class="fi fi-rr-comment-alt"></i></div>
    <div class="w-info">
      <h3>iSEL AI Assistant</h3>
      <div class="w-status">
        <div class="status-dot"></div>
        Онлайн
      </div>
    </div>
  </div>

  <div class="chat-messages" id="chat-messages">
    <div class="message bot">
      <div class="msg-avatar"><i class="fi fi-rr-comment-alt"></i></div>
      <div>
        <div class="bubble">Привет! Я ИИ-ассистент платформы iSEL. Чем могу помочь?</div>
        <div class="chips">
          <button class="chip" onclick="sendMessage('Как добавить объект недвижимости?')">Добавить объект</button>
          <button class="chip" onclick="sendMessage('Как заполнить заявление на ТУ?')">Заявление на ТУ</button>
        </div>
      </div>
    </div>
  </div>

  <div class="input-zone">
    <input
      class="chat-input"
      id="chat-input"
      type="text"
      placeholder="Напишите сообщение..."
      onkeydown="if(event.key==='Enter') sendMessage()"
    />
    <button class="send-btn" id="send-btn" onclick="sendMessage()">
      <i class="fi fi-rr-paper-plane"></i>
    </button>
  </div>

</div>

<script>
  const API = (window.location.origin === 'file://' ? 'http://localhost:8001' : window.location.origin) + '/api/v1';
  let sessionId = 'demo-' + Math.random().toString(36).substr(2, 9);
  let selectedFile = null;
  let chatOpen = false;

  // ─── Widget ────────────────────────────────────────────────────────────────

  function toggleChat() {
    chatOpen = !chatOpen;
    document.getElementById('fab').classList.toggle('open', chatOpen);
    document.getElementById('chat-widget').classList.toggle('open', chatOpen);
    if (chatOpen) document.getElementById('chat-input').focus();
  }

  // ─── Documents ────────────────────────────────────────────────────────────

  function handleFileSelect(input) {
    selectedFile = input.files[0];
    if (!selectedFile) return;
    document.getElementById('selected-name').textContent = selectedFile.name;
    document.getElementById('selected-file').style.display = 'flex';
    document.getElementById('upload-btn').disabled = false;
  }

  async function uploadFile() {
    if (!selectedFile) return;
    const btn = document.getElementById('upload-btn');
    const status = document.getElementById('upload-status');

    btn.disabled = true;
    btn.textContent = 'Загружаю...';
    status.className = 'status-msg info';
    status.textContent = '⏳ Сохранение файла...';

    const formData = new FormData();
    formData.append('file', selectedFile);

    try {
      const res = await fetch(`${API}/upload`, { method: 'POST', body: formData });
      const data = await res.json();
      if (res.ok) {
        status.className = 'status-msg success';
        status.textContent = '✅ Файл сохранён — нажмите «Переиндексировать» для обновления графа';
        selectedFile = null;
        document.getElementById('selected-file').style.display = 'none';
        document.getElementById('file-input').value = '';
        loadDocuments();
      } else {
        status.className = 'status-msg error';
        status.textContent = '❌ Ошибка: ' + (data.detail || 'Неизвестная ошибка');
      }
    } catch (e) {
      status.className = 'status-msg error';
      status.textContent = '❌ Сервер недоступен';
    }

    btn.textContent = 'Загрузить документ';
    btn.disabled = false;
  }

  async function reindex() {
    const btn = document.getElementById('reindex-btn');
    const status = document.getElementById('reindex-status');

    btn.disabled = true;
    btn.textContent = '↺ Индексирую...';
    status.className = 'status-msg info';
    status.style.display = 'block';
    status.textContent = '⏳ Подготовка...';

    try {
      const res = await fetch(`${API}/reindex`, { method: 'POST' });
      if (!res.ok || !res.body) {
        status.className = 'status-msg error';
        status.textContent = '❌ Ошибка запуска переиндексации';
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          try { handleReindexEvent(JSON.parse(line.slice(6)), status); } catch {}
        }
      }
    } catch (e) {
      status.className = 'status-msg error';
      status.textContent = '❌ Соединение прервано';
    } finally {
      btn.disabled = false;
      btn.textContent = '↺ Переиндексировать граф знаний';
    }
  }

  function handleReindexEvent(ev, status) {
    if (ev.status === 'wiping') {
      status.textContent = '🗑 Очистка старого графа...';
    } else if (ev.status === 'init') {
      status.textContent = '⚡ Инициализация LightRAG...';
    } else if (ev.status === 'progress') {
      const name = ev.file.length > 33 ? ev.file.substring(33) : ev.file;
      status.textContent = `📄 (${ev.done + 1}/${ev.total}) ${name}`;
    } else if (ev.status === 'file_error') {
      status.className = 'status-msg error';
      const name = ev.file.length > 33 ? ev.file.substring(33) : ev.file;
      status.textContent = `⚠️ Ошибка: ${name} — ${ev.error}`;
    } else if (ev.status === 'error') {
      status.className = 'status-msg error';
      status.textContent = `❌ ${ev.message}`;
    } else if (ev.status === 'done') {
      status.className = 'status-msg success';
      status.textContent = ev.total === 0
        ? '✅ Граф очищен — загрузите документы и переиндексируйте'
        : `✅ Граф обновлён — ${ev.total} документов проиндексировано`;
      loadDocuments();
    }
  }

  async function loadDocuments() {
    try {
      const res = await fetch(`${API}/documents`);
      const data = await res.json();
      const container = document.getElementById('doc-list-container');

      if (data.documents.length === 0) {
        container.innerHTML = '<p style="font-size:13px;color:#94a3b8;">Нет загруженных документов</p>';
        return;
      }

      container.innerHTML = data.documents.map(doc => {
        const safe = doc.filename.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const display = safe.substring(0, 34) + (doc.filename.length > 34 ? '…' : '');
        return `
        <div class="doc-item" id="doc-${CSS.escape(doc.filename)}">
          <div class="doc-name">
            <i class="fi fi-rr-document"></i>
            <span>${display}</span>
          </div>
          <div class="doc-meta">
            <span class="doc-size">${doc.size_kb} KB</span>
            <span class="doc-badge">готов</span>
            <button class="delete-btn" data-filename="${safe}" onclick="deleteDocument(this.dataset.filename)" title="Удалить">
              <i class="fi fi-rr-trash"></i>
            </button>
          </div>
        </div>`;
      }).join('');
    } catch (e) {
      document.getElementById('doc-list-container').innerHTML =
        '<p style="font-size:13px;color:#ef4444;">Ошибка загрузки списка</p>';
    }
  }

  async function deleteDocument(filename) {
    if (!confirm(`Удалить документ?\n${filename}`)) return;
    try {
      const res = await fetch(`${API}/documents/${encodeURIComponent(filename)}`, { method: 'DELETE' });
      if (res.ok) {
        const item = document.getElementById(`doc-${CSS.escape(filename)}`);
        if (item) {
          item.style.transition = 'opacity 0.22s';
          item.style.opacity = '0';
          setTimeout(() => item.remove(), 220);
        }
      } else {
        const data = await res.json();
        alert('Ошибка: ' + (data.detail || 'Неизвестная ошибка'));
      }
    } catch (e) { alert('Сервер недоступен'); }
  }

  // ─── Chat ─────────────────────────────────────────────────────────────────

  function renderMarkdown(text) {
    return text
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/^### (.+)$/gm, '<div style="font-weight:600;margin:6px 0 3px;font-size:13.5px;">$1</div>')
      .replace(/^## (.+)$/gm,  '<div style="font-weight:700;margin:8px 0 4px;font-size:14px;">$1</div>')
      .replace(/^\d+\.\s(.+)$/gm, '<div style="margin:3px 0;">$&</div>')
      .replace(/^[•\-]\s(.+)$/gm, '<div style="margin:2px 0;padding-left:6px;">• $1</div>')
      .replace(/\n/g, '<br>');
  }

  function addMessage(text, role, source = '', handoff = false) {
    const container = document.getElementById('chat-messages');
    const div = document.createElement('div');
    div.className = `message ${role}${handoff ? ' handoff' : ''}`;
    const sourceTag = '';

    if (role === 'bot') {
      div.innerHTML = `
        <div class="msg-avatar"><i class="fi fi-rr-comment-alt"></i></div>
        <div>
          <div class="bubble">${renderMarkdown(text)}</div>
          ${sourceTag}
        </div>`;
    } else {
      div.innerHTML = `<div class="bubble">${renderMarkdown(text)}</div>`;
    }

    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  }

  function addTyping() {
    const container = document.getElementById('chat-messages');
    const div = document.createElement('div');
    div.className = 'message bot';
    div.id = 'typing-indicator';
    div.innerHTML = `
      <div class="msg-avatar"><i class="fi fi-rr-comment-alt"></i></div>
      <div class="typing-bubble">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>`;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  async function sendMessage(text) {
    const input = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const message = text || input.value.trim();
    if (!message) return;

    input.value = '';
    sendBtn.disabled = true;
    addMessage(message, 'user');
    addTyping();

    try {
      const res = await fetch(`${API}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message,
          session_id: sessionId,
          page: '/demo',
          language: 'ru'
        })
      });
      const data = await res.json();
      removeTyping();
      addMessage(data.answer, 'bot', data.source, data.handoff);
    } catch (e) {
      removeTyping();
      addMessage('❌ Сервер недоступен. Проверьте подключение.', 'bot');
    }

    sendBtn.disabled = false;
    input.focus();
  }

  // ─── Init ──────────────────────────────────────────────────────────────────
  loadDocuments();
  setInterval(loadDocuments, 10000);
</script>
</body>
</html>
