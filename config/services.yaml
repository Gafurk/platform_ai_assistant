# config/services.yaml
# Single source of truth for all service intent definitions.
# To add a new service: copy a block below, fill in the fields, add keywords to keywords.yaml.
# No code changes required.

services:

  tu_application:
    display_name:
      ru: "Заявление на технические условия"
      kz: "Техникалық шарттар алуға өтініш"
    description:
      ru: "Подача заявки на получение ТУ для присоединения к электросетям"
      kz: "Электр желілеріне қосылу үшін ТШ алуға өтініш беру"
    detection_patterns:
      filename:
        - "техусловия"
        - "техническое"
        - "туслов"
        - "заявления ту"
      content:
        - " ту "
        - " тқ "
        - "технические условия"
        - "техусловия"
    flow:
      type: "linear"
      max_steps: 5
      requires_entity: true
    entities:
      - "физическое лицо"
      - "юридическое лицо"
    navigation_path:
      ru: "Личный кабинет → левое меню **Услуги** → категория **Электроснабжение** → услуга «Выдача технических условий на присоединение к электрическим сетям»"
      kz: "Жеке кабинет → сол жақ мәзірі **Қызметтер** → **Электрмен жабдықтау** санаты → «Электр желілеріне қосылуға техникалық шарттар беру» қызметі"

  real_estate:
    display_name:
      ru: "Добавление объекта недвижимости"
      kz: "Жылжымайтын мүлік объектісін қосу"
    description:
      ru: "Добавление объекта недвижимости в систему (через кадастр или адрес)"
      kz: "Жылжымайтын мүлік объектісін жүйеге қосу (кадастр немесе адрес арқылы)"
    detection_patterns:
      filename:
        - "недвижим"
        - "real_estate"
      content:
        - "объект недвижимости"
        - "жылжымайтын мүлік"
        - "кадастровый номер"
        - "адресный регистр"
    flow:
      type: "scenario"
      requires_entity: false
      scenarios:
        - "через кадастровый номер"
        - "через адресный регистр"
    navigation_path:
      ru: "Личный кабинет → главная страница → блок **Объекты недвижимости** → кнопка **Добавить**"
      kz: "Жеке кабинет → басты бет → **Жылжымайтын мүлік объектілері** блогы → **Қосу** батырмасы"

  supply_contract_non_residential:
    display_name:
      ru: "Договор электроснабжения (небытовой)"
      kz: "Электрмен жабдықтау шарты (тұрмыстық емес)"
    description:
      ru: "Заключение небытового договора электроснабжения для юридических лиц и ИП"
      kz: "Заңды тұлғалар мен ЖК үшін тұрмыстық емес электрмен жабдықтау шартын жасасу"
    detection_patterns:
      filename:
        - "небытовой"
        - "supply_contract_non"
      content:
        - "договор небытов"
        - "небытового договора"
        - "встроенное помещение"
        - "пристроенное помещение"
        - "тұрмыстық емес шарт"
    flow:
      type: "faq"
      requires_entity: false
    navigation_path:
      ru: "Личный кабинет → **Услуги** → **Электроснабжение** → «Заключение договора электроснабжения (небытовой)»"
      kz: "Жеке кабинет → **Қызметтер** → **Электрмен жабдықтау** → «Электрмен жабдықтау шартын жасасу (тұрмыстық емес)»"

  supply_contract_residential:
    display_name:
      ru: "Договор электроснабжения (бытовой)"
      kz: "Электрмен жабдықтау шарты (тұрмыстық)"
    description:
      ru: "Заключение бытового договора электроснабжения для физических лиц"
      kz: "Жеке тұлғалар үшін тұрмыстық электрмен жабдықтау шартын жасасу"
    detection_patterns:
      filename:
        - "бытовой"
        - "supply_contract_res"
      content:
        - "договор бытов"
        - "бытового договора"
        - "кондоминиум"
        - "количество проживающих"
        - "тұрмыстық шартты"
    flow:
      type: "faq"
      requires_entity: false
    navigation_path:
      ru: "Личный кабинет → **Услуги** → **Электроснабжение** → «Заключение договора электроснабжения (бытовой)»"
      kz: "Жеке кабинет → **Қызметтер** → **Электрмен жабдықтау** → «Электрмен жабдықтау шартын жасасу (тұрмыстық)»"

  load_calculation:
    display_name:
      ru: "Расчёт электрической нагрузки"
      kz: "Электр жүктемесін есептеу"
    description:
      ru: "Расчёт электрической нагрузки объекта"
      kz: "Объектінің электр жүктемесін есептеу"
    detection_patterns:
      filename:
        - "нагрузк"
        - "расчёт"
        - "load_calc"
      content:
        - "расчет нагрузки"
        - "расчёт нагрузки"
        - "электрическая нагрузка"
        - "жүктеме есебі"
        - "жүктемені есептеу"
    flow:
      type: "faq"
      requires_entity: false
    navigation_path:
      ru: "Личный кабинет → **Услуги** → **Электроснабжение** → «Расчёт электрической нагрузки»"
      kz: "Жеке кабинет → **Қызметтер** → **Электрмен жабдықтау** → «Электр жүктемесін есептеу»"

  draft_design:
    display_name:
      ru: "Разработка эскизного проекта"
      kz: "Эскиздік жобаны әзірлеу"
    description:
      ru: "Разработка эскизного проекта внешнего электроснабжения"
      kz: "Сыртқы электрмен жабдықтаудың эскиздік жобасын әзірлеу"
    detection_patterns:
      filename:
        - "эскизн"
        - "draft_design"
      content:
        - "эскизный проект"
        - "разработка эскизного"
        - "эскиздік жоба"
        - "эскиздік жобаны"
    flow:
      type: "faq"
      requires_entity: false
    navigation_path:
      ru: "Личный кабинет → **Услуги** → **Электроснабжение** → «Разработка эскизного проекта»"
      kz: "Жеке кабинет → **Қызметтер** → **Электрмен жабдықтау** → «Эскиздік жобаны әзірлеу»"

  construction_works:
    display_name:
      ru: "Строительно-монтажные работы"
      kz: "Құрылыс-монтаждау жұмыстары"
    description:
      ru: "Выполнение строительно-монтажных работ (СМР)"
      kz: "Құрылыс-монтаждау жұмыстарын (ҚМЖ) орындау"
    detection_patterns:
      filename:
        - "смр"
        - "строительн"
        - "construction"
      content:
        - "строительно-монтажн"
        - "строительно монтажн"
        - " смр "
        - "құрылыс-монтаж"
        - "монтаж жұмыстары"
    flow:
      type: "faq"
      requires_entity: false
    navigation_path:
      ru: "Личный кабинет → **Услуги** → **Электроснабжение** → «Строительно-монтажные работы»"
      kz: "Жеке кабинет → **Қызметтер** → **Электрмен жабдықтау** → «Құрылыс-монтаждау жұмыстары»"

  primary_connection_residential:
    display_name:
      ru: "Первичное подключение (бытовой)"
      kz: "Алғашқы қосылу (тұрмыстық)"
    description:
      ru: "Заявление об акцепте договора электроснабжения для физических лиц при первичном подключении"
      kz: "Жеке тұлғалар үшін алғашқы қосылу кезіндегі электрмен жабдықтау шартын акцептеу туралы өтініш"
    detection_patterns:
      filename:
        - "первичное подключение бытовой"
        - "primary_connection_res"
      content:
        - "первичное подключение бытовой"
        - "акцепте договора для бытовых"
        - "вид недвижимости первичное"
        - "алғашқы қосылу тұрмыстық"
    flow:
      type: "linear"
      max_steps: 4
      requires_entity: false
    navigation_path:
      ru: "Личный кабинет → **Услуги** → **Электроснабжение** → «Первичное подключение электроустановок потребителя к сети» → в модальном окне выбрать **«Бытовой»**"
      kz: "Жеке кабинет → **Қызметтер** → **Электрмен жабдықтау** → «Тұтынушының электр қондырғыларын желіге алғашқы қосу» → модалдық терезеде **«Тұрмыстық»** таңдаңыз"

  primary_connection_nonresidential:
    display_name:
      ru: "Первичное подключение (небытовой)"
      kz: "Алғашқы қосылу (тұрмыстық емес)"
    description:
      ru: "Заявление на заключение договора электроснабжения для юридических лиц и ИП при первичном подключении"
      kz: "Заңды тұлғалар мен ЖК үшін алғашқы қосылу кезіндегі электрмен жабдықтау шартын жасасу өтініші"
    detection_patterns:
      filename:
        - "первичное подключение небытовой"
        - "primary_connection_non"
      content:
        - "первичное подключение небытовой"
        - "заключение договора электроснабжения не для бытовых"
        - "алғашқы қосылу тұрмыстық емес"
    flow:
      type: "linear"
      max_steps: 5
      requires_entity: false
    navigation_path:
      ru: "Личный кабинет → **Услуги** → **Электроснабжение** → «Первичное подключение электроустановок потребителя к сети» → в модальном окне выбрать **«Небытовой»**"
      kz: "Жеке кабинет → **Қызметтер** → **Электрмен жабдықтау** → «Тұтынушының электр қондырғыларын желіге алғашқы қосу» → модалдық терезеде **«Тұрмыстық емес»** таңдаңыз"

  meter_sealing:
    display_name:
      ru: "Установка/снятие пломбы"
      kz: "Пломбаны орнату/алу"
    description:
      ru: "Установка или снятие пломбы с прибора учёта"
      kz: "Есептеуіш аспапқа пломбаны орнату немесе алу"
    detection_patterns:
      filename:
        - "пломб"
        - "meter_seal"
      content:
        - "пломб"
        - "установка пломбы"
        - "снятие пломбы"
        - "пломбаны орнату"
        - "пломбаны алу"
    flow:
      type: "faq"
      requires_entity: false
    navigation_path:
      ru: "Личный кабинет → **Услуги** → **Электроснабжение** → «Установка/снятие пломбы»"
      kz: "Жеке кабинет → **Қызметтер** → **Электрмен жабдықтау** → «Пломбаны орнату/алу»"
