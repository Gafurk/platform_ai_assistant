# config/keywords.yaml
# Single source of truth for all intent keywords.
#
# Two sections per service:
#   flow_keywords  — used by classify_intent() and has_flow_keywords() in flows/registry.py
#                    Only SPECIFIC terms to avoid false positives.
#   filter_keywords — used by _filter_context_by_intent() in lightrag_service.py
#                    Broader set including field names unique to this service.
#                    (Phase 3 will replace keyword-based filtering with metadata tags.)

