services:
  # LightRAG backend services are no longer needed as external services
  # LightRAG uses:
  # - Local nano-vectordb (embedded, no external service)
  # - Local NetworkX graph store (embedded, no external service)
  # - OpenAI API (gpt-4.1-nano for LLM, text-embedding-3-small for embeddings)

  # To run the application:
  # 1. pip install lightrag-hku openai
  # 2. Set OPENAI_API_KEY in .env
  # 3. Run: uvicorn app.main:app --reload --port 8001

