stages: [lint, test, build]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"

cache:
  paths:
    - .pip-cache/
    - .venv/

.python:
  image: python:3.11-slim
  before_script:
    - python -m venv .venv
    - . .venv/bin/activate
    - pip install --quiet -r requirements.txt

lint:
  stage: lint
  extends: .python
  before_script:
    - pip install --quiet ruff
  script:
    - ruff check app/ tests/ ingestion/

test:
  stage: test
  extends: .python
  before_script:
    - pip install --quiet -r requirements.txt pytest pytest-asyncio pytest-cov
  script:
    - pytest tests/ -v --cov=app --cov-report=term-missing --cov-report=xml
  coverage: '/TOTAL.+?(\d+\%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    when: always
    expire_in: 1 week

build-image:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker build -t "$CI_REGISTRY_IMAGE:latest" .
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
